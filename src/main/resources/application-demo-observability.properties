# Local traces only. Metrics remain in the local Actuator registry.
management.tracing.export.enabled=true
management.tracing.export.otlp.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${ARGUS_OTLP_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.connect-timeout=1s
management.opentelemetry.tracing.export.otlp.timeout=2s
management.endpoints.web.exposure.include=health,metrics
