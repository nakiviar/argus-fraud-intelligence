spring.application.name=argus-fraud-intelligence
spring.profiles.default=demo-local

spring.ai.model.chat=none
spring.ai.chat.client.enabled=false
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

management.endpoints.web.exposure.include=health

# Educational demonstration time budgets
argus.investigation.deadline=PT35S
argus.investigation.agent-timeout=PT25S
argus.investigation.http-request-timeout=PT10S
