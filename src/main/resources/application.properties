spring.application.name=argus-fraud-intelligence
spring.profiles.default=demo-local

spring.ai.model.chat=none
spring.ai.chat.client.enabled=false
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

management.endpoints.web.exposure.include=health

# Educational demonstration time budgets
argus.investigation.deadline=PT35S
argus.investigation.agent-timeout=PT25S
argus.investigation.http-request-timeout=PT10S

# Tracing export is explicit. Default execution uses only the local registry.
management.tracing.export.enabled=false
management.tracing.sampling.probability=0.0
management.otlp.metrics.export.enabled=false
management.logging.export.enabled=false

spring.ai.chat.client.observations.log-prompt=false
spring.ai.chat.client.observations.log-completion=false
spring.ai.chat.observations.log-prompt=false
spring.ai.chat.observations.log-completion=false
spring.ai.tools.observations.include-content=false
logging.level.org.springframework.ai.openai.OpenAiChatModel=OFF
logging.level.org.springframework.ai.model.tool.DefaultToolCallingManager=OFF
logging.level.org.springframework.ai.model.observation.ErrorLoggingObservationHandler=OFF
spring.ai.chat.observations.include-error-logging=false
management.tracing.baggage.enabled=false
